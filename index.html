<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3d-globe</title>
  </head>
  <body>
    <div id="mc-loader-wrapper">
      <style>
        body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          background-color: #000000;
        }
        #mc-loader-wrapper {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: #000000;
          display: flex;
          justify-content: center;
          align-items: center;
          font-family: monospace;
          color: #5a8fba;
          z-index: 9999;
          transition: opacity 1s ease-in-out;
        }
        #mc-loader-wrapper.fade-out {
          opacity: 0;
          pointer-events: none;
        }
        .mc-initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 24px;
        }
        .mc-spinner {
          width: 48px;
          height: 48px;
          border: 2px solid rgba(90, 143, 186, 0.2);
          border-radius: 50%;
          border-top-color: #5a8fba;
          border-right-color: #5a8fba;
          animation: mc-spin 1s linear infinite;
        }
        .mc-loading-text {
          letter-spacing: 3px;
          font-size: 12px;
          animation: mc-pulse 2s ease-in-out infinite;
        }
        @keyframes mc-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes mc-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
        }
      </style>
      <div class="mc-initial-loader">
        <div class="mc-spinner"></div>
        <div class="mc-loading-text">INITIALIZING SYSTEM...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
